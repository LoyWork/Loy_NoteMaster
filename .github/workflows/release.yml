name: Loy NoteMaster Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    if: github.repository == 'LoyWork/Loy_NoteMaster'
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      HUSKY: '0'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22

      - name: Set release version from tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $env:GITHUB_REF_NAME = $env:RELEASE_TAG
          node scripts/prepare-fork-release.cjs

      - name: Check release tag handling
        run: node --test scripts/__tests__/prepare-fork-release.test.cjs

      # Use the packaged N-API prebuild instead of building against host Node.js.
      - name: Install dependencies and Windows runtimes
        run: |
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { throw 'Electron installation failed' }
          node node_modules/@vscode/ripgrep/lib/postinstall.js
          if ($LASTEXITCODE -ne 0) { throw 'ripgrep installation failed' }
          node node_modules/node-pty/scripts/prebuild.js
          if ($LASTEXITCODE -ne 0) { throw 'node-pty Windows prebuild installation failed' }

      - name: Download bundled converters
        run: |
          New-Item -ItemType Directory -Path bin -Force | Out-Null
          curl.exe --fail --location --retry 3 --output bin/win32-pandoc-2.14.2.exe https://github.com/purocean/yn/releases/download/v1.1/win32-pandoc-2.14.2.exe
          if ($LASTEXITCODE -ne 0) { throw 'Pandoc download failed' }
          curl.exe --fail --location --retry 3 --output bin/plantuml.jar https://github.com/plantuml/plantuml/releases/download/v1.2025.0/plantuml.jar
          if ($LASTEXITCODE -ne 0) { throw 'PlantUML download failed' }

      - name: Build application
        run: yarn build

      - name: Package Windows x64 installer and ZIP
        run: yarn electron-builder --config electron-builder.fork.json --win --x64 --publish never

      - name: Verify packaged Windows runtimes
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: |
          $runtimeCheck = Start-Process -FilePath (Resolve-Path './out/windows/win-unpacked/Loy NoteMaster.exe').Path -ArgumentList @('scripts/verify-windows-runtime.cjs', 'out/windows/win-unpacked/resources') -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput out/runtime-check.stdout.log -RedirectStandardError out/runtime-check.stderr.log
          Get-Content out/runtime-check.stdout.log
          Get-Content out/runtime-check.stderr.log
          if ($runtimeCheck.ExitCode -ne 0) { throw 'Packaged runtime verification failed' }

      - name: Prepare release assets and SHA-256 checksums
        run: |
          $packages = @(Get-ChildItem out/windows/Loy-NoteMaster-*.exe, out/windows/Loy-NoteMaster-*.zip)
          if ($packages.Count -ne 2) { throw 'Expected one installer and one ZIP' }
          $updateFiles = @(Get-ChildItem out/windows/*.yml | Where-Object Name -NotLike 'builder-*')
          if ($updateFiles.Count -eq 0) { throw 'Updater metadata is missing' }
          New-Item -ItemType Directory -Path out/release-assets -Force | Out-Null
          @($packages) + @(Get-ChildItem out/windows/*.blockmap) + @($updateFiles) | Copy-Item -Destination out/release-assets
          $packages | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -LiteralPath out/release-assets/SHA256SUMS.txt -Encoding utf8NoBOM

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Loy-NoteMaster-${{ steps.version.outputs.version }}-windows-x64
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: out/release-assets/*

      - name: Publish fork release
        uses: softprops/action-gh-release@v2
        with:
          name: Loy NoteMaster ${{ inputs.tag || github.ref_name }}
          tag_name: ${{ inputs.tag || github.ref_name }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: out/release-assets/*
